name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.name }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Explicit legs keep the check names "test (ubuntu-latest)" and "test (macos-latest)"
        # that branch protection requires; the python 3.9 leg gets its own name.
        include:
          - os: ubuntu-latest
            name: ubuntu-latest
          - os: macos-latest
            name: macos-latest
          - os: ubuntu-22.04  # ubuntu-latest (26.04) has no python 3.9 build
            name: ubuntu-22.04, py3.9
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - if: matrix.python-version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 --version
      - run: python3 -m unittest discover -s test -t . -v
      - run: python3 test/bench_guard.py
